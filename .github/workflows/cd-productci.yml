name: CI/CD Product API

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit test
        run: npm test

      - name: Build Docker image
        run: docker build -t product-api:ci .

      - name: Run container and wait for healthcheck
        run: |
          docker run -d --name product-api-ci --network host \
            -e PORT=3000 \
            -e MONGO_URI=mongodb://localhost:27017/productdb \
            product-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then
              echo "Container API is healthy"
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/health

      - name: Run API CRUD tests
        run: npm run test:api

      - name: Show container logs on failure
        if: failure()
        run: docker logs product-api-ci

  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ github.sha }}
