name: Product API CD - Docker Hub

# Chỉ chạy SAU KHI workflow CI Production chạy xong trên nhánh main
on:
  workflow_run:
    workflows: ["Product API CI - Production"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # ================================================================
  # JOB 1: GitHub Actions -> Docker Hub (chạy trên máy ảo GitHub)
  # ================================================================
  deploy:
    name: Build va Push len Docker Hub
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      version: ${{ steps.meta.outputs.version }}

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/product-api

    steps:
      - name: 1. Lay ma nguon (dung commit da qua CI)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 2. Kiem tra Secrets Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "THIEU SECRET DOCKERHUB_USERNAME hoac DOCKERHUB_TOKEN"
            exit 1
          fi
          echo "Da co du secrets Docker Hub"

      - name: 3. Tao cac tag phien ban
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "version=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "sha=sha-$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Phien ban: 1.0.${{ github.run_number }} | Commit: $SHORT_SHA"

      - name: 4. Dang nhap Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Chuan bi cong cu build
        uses: docker/setup-buildx-action@v3

      - name: 6. Build va Push image len Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}

      - name: 7. Kiem tra sau trien khai - pull tu Docker Hub va healthcheck
        run: |
          TAG=$IMAGE:${{ steps.meta.outputs.version }}

          echo "=== Pull image vua day len ==="
          docker pull $TAG

          echo "=== Chay MongoDB tam de kiem tra ==="
          docker network create verify-net
          docker run -d --name verify-mongo --network verify-net \
            -e MONGO_INITDB_ROOT_USERNAME=verify \
            -e MONGO_INITDB_ROOT_PASSWORD=verifyPass123 \
            mongo:8
          for i in $(seq 1 30); do
            docker exec verify-mongo mongosh --quiet --eval "db.adminCommand('ping')" > /dev/null 2>&1 && break
            sleep 2
          done

          echo "=== Chay image tu Docker Hub (dung HEALTHCHECK trong image) ==="
          docker run -d --name verify-api --network verify-net -p 3000:3000 \
            -e PORT=3000 \
            -e MONGO_URI="mongodb://verify:verifyPass123@verify-mongo:27017/verifydb?authSource=admin" \
            $TAG

          STATUS=starting
          for i in $(seq 1 30); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' verify-api)
            echo "Lan $i: verify-api = $STATUS"
            if [ "$STATUS" = "healthy" ]; then break; fi
            sleep 3
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "FAIL - Image tren Docker Hub khong dat healthy"
            docker logs verify-api
            exit 1
          fi

          curl -sf http://localhost:3000/health
          echo ""
          echo "PASS - Image tren Docker Hub chay duoc va healthy"

      - name: 8. Don dep
        if: always()
        run: |
          docker rm -f verify-api verify-mongo || true
          docker network rm verify-net || true

      - name: 9. Tom tat trien khai Docker Hub
        run: |
          {
            echo "## Da day image len Docker Hub"
            echo ""
            echo "| Tag | Lenh pull |"
            echo "|---|---|"
            echo "| latest | \`docker pull $IMAGE:latest\` |"
            echo "| ${{ steps.meta.outputs.version }} | \`docker pull $IMAGE:${{ steps.meta.outputs.version }}\` |"
            echo "| ${{ steps.meta.outputs.sha }} | \`docker pull $IMAGE:${{ steps.meta.outputs.sha }}\` |"
          } >> $GITHUB_STEP_SUMMARY

  # ================================================================
  # JOB 2: Docker Hub -> Docker Engine local (chạy trên MÁY BẠN)
  # ================================================================
  deploy-local:
    name: Trien khai len Docker Engine local
    needs: deploy
    runs-on: [self-hosted, local-docker]
    timeout-minutes: 20

    env:
      MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      APP_DB_USER: ${{ secrets.APP_DB_USER }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      APP_DB_NAME: productdb
      APP_VERSION: ${{ needs.deploy.outputs.version }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: 1. Lay file cau hinh trien khai
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 2. Kiem tra Docker Engine tren may local
        run: |
          $ErrorActionPreference = 'Continue'
          $v = docker version --format "{{.Server.Version}}"
          if ($LASTEXITCODE -ne 0) { throw "Docker Desktop chua chay tren may local" }
          "Docker Engine: $v"
          if (-not $env:APP_VERSION) { throw "Khong nhan duoc phien ban tu job deploy" }
          "Phien ban se trien khai: $env:APP_VERSION"

      - name: 3. Ghi nho phien ban dang chay (de rollback)
        run: |
          $ErrorActionPreference = 'Continue'
          $old = docker inspect --format "{{.Config.Image}}" product-api-prod 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $old) { $old = "none" }
          "Phien ban dang chay: $old"
          Add-Content -Path $env:GITHUB_ENV -Value "OLD_IMAGE=$old"
          exit 0

      - name: 4. Pull image tu Docker Hub va trien khai
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f docker-compose-prod.yaml pull api-prod
          if ($LASTEXITCODE -ne 0) { throw "Pull image tu Docker Hub that bai" }
          docker compose -f docker-compose-prod.yaml up -d --wait --wait-timeout 180
          if ($LASTEXITCODE -ne 0) { throw "Trien khai that bai hoac khong dat healthy" }
          "Da trien khai phien ban $env:APP_VERSION"

      - name: 5. Kiem tra sau trien khai
        run: |
          $ErrorActionPreference = 'Continue'
          $img = docker inspect --format "{{.Config.Image}}" product-api-prod
          $health = docker inspect --format "{{.State.Health.Status}}" product-api-prod
          "Image: $img"
          "Health: $health"
          if ($img -notlike "*:$env:APP_VERSION") { throw "FAIL - Container khong chay dung phien ban $env:APP_VERSION" }
          if ($health -ne "healthy") { throw "FAIL - Container khong healthy" }

          $root = Invoke-RestMethod -Uri http://localhost:3001/
          "API bao phien ban: $($root.version)"
          if ($root.version -ne $env:APP_VERSION) { throw "FAIL - API bao sai phien ban" }

          $h = Invoke-RestMethod -Uri http://localhost:3001/health
          if ($h.status -ne "ok") { throw "FAIL - /health khong ok" }

          $list = @(Invoke-RestMethod -Uri http://localhost:3001/api/products)
          "So san pham hien co: $($list.Count)"
          "PASS - Trien khai local thanh cong: $img ($health)"

      - name: 6. Rollback neu trien khai that bai
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:OLD_IMAGE -eq "none") { "Khong co phien ban cu de rollback"; exit 0 }
          $env:APP_VERSION = $env:OLD_IMAGE.Split(':')[-1]
          "ROLLBACK ve: $env:OLD_IMAGE"
          docker compose -f docker-compose-prod.yaml up -d --wait --wait-timeout 180
          exit 0

      - name: 7. Don dep image khong con dung
        if: success()
        run: |
          docker image prune -f
          exit 0

      - name: 8. Tom tat trien khai local
        if: success()
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Da trien khai len Docker Engine local"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Phien ban moi: $env:APP_VERSION"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Phien ban truoc: $env:OLD_IMAGE"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Kiem tra: http://localhost:3001"
